name: 🔐 Pipeline DevSecOps

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  security:
    name: Scans e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets scanning - arquivos atuais
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --redact --exit-code 1

      - name: Secrets scanning - novos commits
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            echo "Primeiro push: arquivos atuais já foram analisados."
          fi

      - name: Instalar Semgrep
        run: python3 -m pip install "semgrep==1.180.0"

      - name: SAST - Semgrep
        run: semgrep scan --config .semgrep.yml --error --strict --metrics off --disable-version-check src/

      - name: SCA - Grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          path: .
          fail-build: true
          severity-cutoff: medium
          grype-version: v0.120.1
          only-fixed: false
          output-format: table

      - name: Testes funcionais e de segurança
        run: node --test tests/*.test.cjs

  build:
    name: Empacotamento e assinatura
    needs: security
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # ── Empacota o site em um artefato tar (formato que o Pages consome)
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C src \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest  artifact.tar" > artifact.tar.sha256
          echo "SHA256: $digest"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9

      - name: Assinar artefato
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cosign sign-blob artifact.tar --bundle artifact.sigstore.json --yes

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 7
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9

      - name: Verificar hash e assinatura antes da extração
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/pipeline.yml@refs/heads/main
        run: |
          sha256sum --check artifact.tar.sha256
          cosign verify-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
